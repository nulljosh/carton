name: Carton
options:
  bundleIdPrefix: com.nulljosh
  deploymentTarget: { iOS: "17.0", macOS: "14.0" }
targets:
  Carton:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - app/Carton
      - Carton.icon
      - path: fonts
        includes: ["*.ttf"]
        buildPhase: resources
    entitlements:
      path: app/Carton.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.carton
        ASSETCATALOG_COMPILER_APPICON_NAME: Carton
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Carton
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": app/Carton-macOS.entitlements
        MARKETING_VERSION: 0.1.0
        SWIFT_VERSION: "5.9"
