name: Cartons
options:
  bundleIdPrefix: com.nulljosh
  deploymentTarget: { iOS: "17.0", macOS: "14.0" }
targets:
  Cartons:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - app/Cartons
      - Cartons.icon
      - Tuck.icon
      - path: fonts
        includes: ["*.ttf"]
        buildPhase: resources
    info:
      path: app/Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers: [com.nulljosh.carton.refresh]
        UIBackgroundModes: [fetch]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    entitlements:
      path: app/Cartons.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.carton
        DEVELOPMENT_TEAM: QMM486NPYC
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: Cartons
        "ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES[sdk=iphone*]": Tuck
        "ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS[sdk=iphone*]": YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cartons
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": app/Cartons-macOS.entitlements
        MARKETING_VERSION: 1.0.0
        SWIFT_VERSION: "5.9"
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
