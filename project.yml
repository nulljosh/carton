name: Carton
options:
  bundleIdPrefix: com.nulljosh
  deploymentTarget: { iOS: "17.0" }
targets:
  Carton:
    type: application
    platform: iOS
    sources: [app/Carton, Carton.icon]
    entitlements:
      path: app/Carton.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.carton
        ASSETCATALOG_COMPILER_APPICON_NAME: Carton
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Carton
        MARKETING_VERSION: 0.1.0
        SWIFT_VERSION: "5.9"
