name = "carton"
main = "worker/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
routes = [{ pattern = "carton.jaybulb.com", custom_domain = true }]

[assets]
directory = "web"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[browser]
binding = "BROWSER"

# 10 lookups a minute per visitor, so the page can't be used as a UPS scraper
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
