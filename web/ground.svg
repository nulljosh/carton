<!-- The hero ground: a quiet stylized map. The route, box and labels are drawn live on top by app.js. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
      <defs>
        <linearGradient id="m-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9e6ec"/><stop offset="1" stop-color="#c3d6df"/></linearGradient>
        <linearGradient id="m-land" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7eedf"/><stop offset="1" stop-color="#ecdcc0"/></linearGradient>
        <radialGradient id="m-glow" cx=".75" cy=".7" r=".6"><stop offset="0" stop-color="#fffaf0" stop-opacity=".9"/><stop offset="1" stop-color="#fffaf0" stop-opacity="0"/></radialGradient>
        <filter id="m-grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .35 0 0 0 0 .22 0 0 0 0 .1 0 0 0 .5 0"/></filter>
