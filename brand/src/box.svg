<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
<linearGradient id="top" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#d9a76c"/><stop offset="1" stop-color="#e8bd86"/></linearGradient>
<linearGradient id="front" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c88f55"/><stop offset="1" stop-color="#a66d3a"/></linearGradient>
<linearGradient id="side" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9a6434"/><stop offset="1" stop-color="#7a4b23"/></linearGradient>
<linearGradient id="tape" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f0d39d" stop-opacity=".92"/><stop offset=".5" stop-color="#fbe7c2" stop-opacity=".95"/><stop offset="1" stop-color="#ecca8e" stop-opacity=".92"/></linearGradient>
<linearGradient id="tapef" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9c68c" stop-opacity=".95"/><stop offset="1" stop-color="#d8b071" stop-opacity=".95"/></linearGradient>
<linearGradient id="ao" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a1f08" stop-opacity=".22"/><stop offset="1" stop-color="#3a1f08" stop-opacity="0"/></linearGradient>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="9"/><feColorMatrix values="0 0 0 0 .22  0 0 0 0 .12  0 0 0 0 .04  0 0 0 .16 0"/></filter>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
</defs>
<!-- faces -->
<path d="M0 0 H910 L800 340 H0 Z" fill="url(#top)"/>
<path d="M0 340 H800 V1024 H0 Z" fill="url(#front)"/>
<path d="M800 340 L910 0 H1024 V1024 H800 Z" fill="url(#side)"/>
<!-- corrugation flutes on the side -->
<g stroke="#5c3714" stroke-opacity=".12" stroke-width="3"><path d="M840 230V1024M880 110V1024M920 0V1024M960 0V1024M1000 0V1024"/></g>
<!-- flap seam on top, under tape -->
<path d="M400 340 L510 0" stroke="#7d4e22" stroke-opacity=".5" stroke-width="6"/>
<!-- creased edges -->
<path d="M0 340 H800" stroke="#f2cf9c" stroke-opacity=".9" stroke-width="6"/>
<path d="M800 340 V1024" stroke="#e0b07a" stroke-opacity=".6" stroke-width="5"/>
<path d="M800 340 L910 0" stroke="#f2cf9c" stroke-opacity=".7" stroke-width="5"/>
<rect y="343" width="800" height="60" fill="url(#ao)"/>
<!-- packing tape over the top and down the front -->
<path d="M330 340 H470 L580 0 H440 Z" fill="url(#tape)"/>
<path d="M330 340 H470 V600 L455 612 L440 598 L424 614 L408 600 L392 615 L376 601 L360 613 L345 600 L330 610 Z" fill="url(#tapef)"/>
<path d="M352 340 L462 0" stroke="#fff" stroke-opacity=".45" stroke-width="10"/>
<path d="M352 340 V600" stroke="#fff" stroke-opacity=".3" stroke-width="8"/>
<!-- shipping label -->
<g transform="rotate(-3 640 790)">
<rect x="512" y="664" width="250" height="240" rx="12" fill="#3a1f08" opacity=".35" filter="url(#soft)" transform="translate(6 10)"/>
<rect x="512" y="664" width="250" height="240" rx="12" fill="#fbfaf5"/>
<rect x="540" y="692" width="120" height="14" rx="7" fill="#c9c6bd"/>
<rect x="540" y="718" width="180" height="14" rx="7" fill="#dedbd3"/>
<rect x="540" y="744" width="150" height="14" rx="7" fill="#dedbd3"/>
<g fill="#2b2b2b"><rect x="540" y="790" width="8" height="84"/><rect x="556" y="790" width="4" height="84"/><rect x="566" y="790" width="12" height="84"/><rect x="586" y="790" width="4" height="84"/><rect x="596" y="790" width="8" height="84"/><rect x="612" y="790" width="14" height="84"/><rect x="634" y="790" width="4" height="84"/><rect x="644" y="790" width="8" height="84"/><rect x="660" y="790" width="4" height="84"/><rect x="670" y="790" width="12" height="84"/><rect x="690" y="790" width="6" height="84"/><rect x="704" y="790" width="4" height="84"/><rect x="714" y="790" width="10" height="84"/></g>
</g>
<!-- grain over everything -->
<rect width="1024" height="1024" filter="url(#grain)"/>
</svg>
